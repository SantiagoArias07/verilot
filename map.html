<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
:root{--acc:#00E5FF}
html,body{margin:0;height:100%;background:#08090C;color:#EEF1F5;font-family:Geist,system-ui,sans-serif;overflow:hidden}
#wrap{height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:16px;left:20px;font:500 11px/1.6 "Geist Mono",monospace;letter-spacing:.12em;color:#9BA3AF;text-transform:uppercase}
.hud b{color:var(--acc);font-weight:500}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #1E222B}
.tab{position:relative;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:20px 22px 22px;cursor:pointer;border-right:1px solid #1E222B;display:flex;flex-direction:column;gap:8px}
.tab:last-child{border-right:0}
.tab .n{font:500 11px "Geist Mono",monospace;letter-spacing:.12em;color:#9BA3AF}
.tab .t{font-size:17px;font-weight:500;letter-spacing:-.01em}
.tab .d{font-size:13.5px;line-height:1.45;color:#9BA3AF;text-wrap:pretty}
.tab .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tab .chips span{font:500 10.5px "Geist Mono",monospace;letter-spacing:.06em;padding:4px 8px;border:1px solid #2A303B;border-radius:999px;color:#C5CBD3}
.tab .bar{position:absolute;left:0;top:-1px;height:2px;background:var(--acc);width:0}
.tab.on .n{color:var(--acc)}
.tab.on .chips span{border-color:var(--acc);color:#EEF1F5}
.tab:not(.on) .t{color:#9BA3AF}
@media (max-width:640px){.tabs{grid-template-columns:1fr}.tab{border-right:0;border-bottom:1px solid #1E222B;padding:12px 18px}.tab .d,.tab .chips{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas><div class="hud">Module network · <b id="hudp">Stage 01</b><br><span id="hudn">4 active hubs</span></div></div>
  <div class="tabs" id="tabs"></div>
</div>
<script>
const PH=[
 {n:'01 · Live',t:'Clear polymers',d:'PET and PP flake certified at the source across four industrial hubs on three continents.',c:['PET','PP']},
 {n:'02 · Expanding',t:'Full polymer range',d:'HDPE, LDPE and mixed rigids, plus a verified buyer network for certified batches.',c:['HDPE','LDPE','Buyer network']},
 {n:'03 · Roadmap',t:'Textiles & metals',d:'Same optical hardware, new models — built for markets with mandatory recycled-content targets.',c:['Textiles','Metals','Other streams']}
];
const CITIES=[
 {n:'Monterrey',c:[-100.31,25.67],p:1,m:1},{n:'Ohio',c:[-82.99,39.96],p:1,m:1},{n:'Stuttgart',c:[9.18,48.78],p:1,m:1},{n:'Shenzhen',c:[114.06,22.54],p:1,m:1},
 {n:'Guadalajara',c:[-103.35,20.67],p:2},{n:'São Paulo',c:[-46.63,-23.55],p:2},{n:'Rotterdam',c:[4.48,51.92],p:2},{n:'Bangkok',c:[100.5,13.75],p:2},
 {n:'Bogotá',c:[-74.07,4.71],p:3},{n:'Milan',c:[9.19,45.46],p:3},{n:'Osaka',c:[135.5,34.69],p:3},{n:'Johannesburg',c:[28.05,-26.2],p:3}
];
let ACC='#00E5FF',phase=1,auto=true,phaseT=performance.now(),R=0,land=null,dots=[],proj=null,W=0,H=0;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
window.addEventListener('message',e=>{if(e.data&&e.data.vlAcc){ACC=e.data.vlAcc;document.documentElement.style.setProperty('--acc',ACC)}});
const tabs=document.getElementById('tabs');
PH.forEach((p,i)=>{const b=document.createElement('button');b.className='tab';b.innerHTML=`<div class="bar"></div><div class="n">${p.n}</div><div class="t">${p.t}</div><div class="d">${p.d}</div><div class="chips">${p.c.map(x=>`<span>${x}</span>`).join('')}</div>`;b.onclick=()=>{auto=false;setPhase(i+1)};tabs.appendChild(b)});
function setPhase(p){phase=p;phaseT=performance.now();[...tabs.children].forEach((b,i)=>{b.classList.toggle('on',i===p-1);b.querySelector('.bar').style.width=(i===p-1&&!auto)?'100%':'0'});document.getElementById('hudp').textContent='Stage 0'+p;const n=CITIES.filter(c=>c.p<=p).length;document.getElementById('hudn').textContent=n+' active hubs'}
setPhase(1);
function build(){
  const r=cv.getBoundingClientRect();W=r.width;H=r.height;if(!W||!land)return;
  const d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  proj=d3.geoNaturalEarth1().fitExtent([[24,40],[W-24,H-16]],land);
  const off=document.createElement('canvas');off.width=Math.ceil(W);off.height=Math.ceil(H);const o=off.getContext('2d');
  o.fillStyle='#fff';o.beginPath();d3.geoPath(proj,o)(land);o.fill();
  const data=o.getImageData(0,0,off.width,off.height).data;const step=Math.max(5,Math.round(W/170));dots=[];
  for(let y=step/2;y<H;y+=step)for(let x=step/2;x<W;x+=step){if(data[(Math.floor(y)*off.width+Math.floor(x))*4+3]>100)dots.push([x,y])}
  CITIES.forEach(c=>{c.xy=proj(c.c)});
}
function draw(t){
  requestAnimationFrame(draw);if(!dots.length)return;
  if(auto){const e=t-phaseT;tabs.children[phase-1].querySelector('.bar').style.width=Math.min(100,e/5200*100)+'%';if(e>5200)setPhase(phase%3+1)}
  ctx.clearRect(0,0,W,H);
  const o=CITIES[0].xy,target=[W*.62,W*.85,W*1.1][phase-1];R+=(target-R)*.04;
  const ang=t*.0011;
  for(const [x,y] of dots){const dx=x-o[0],dy=y-o[1],dist=Math.hypot(dx,dy);let a=.13;
    if(dist<R){let da=(Math.atan2(dy,dx)-ang)%(Math.PI*2);if(da<0)da+=Math.PI*2;const sw=Math.max(0,1-da/1.4);a=.24+sw*.5;ctx.fillStyle=sw>.05?hexA(ACC,a):`rgba(255,255,255,${a})`}else ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.fillRect(x-.9,y-.9,1.8,1.8)}
  ctx.strokeStyle=hexA(ACC,.18);ctx.lineWidth=1;for(let k=1;k<=3;k++){ctx.beginPath();ctx.arc(o[0],o[1],R*k/3,0,7);ctx.stroke()}
  ctx.strokeStyle=hexA(ACC,.5);ctx.beginPath();ctx.moveTo(o[0],o[1]);ctx.lineTo(o[0]+Math.cos(ang)*R,o[1]+Math.sin(ang)*R);ctx.stroke();
  CITIES.forEach((c,i)=>{if(i===0||c.p>phase)return;const [x,y]=c.xy,mx=(o[0]+x)/2,my=(o[1]+y)/2-Math.hypot(x-o[0],y-o[1])*.28;
    ctx.strokeStyle=hexA(ACC,.45);ctx.beginPath();ctx.moveTo(o[0],o[1]);ctx.quadraticCurveTo(mx,my,x,y);ctx.stroke();
    const u=(t*.00035+i*.17)%1,qx=(1-u)*(1-u)*o[0]+2*(1-u)*u*mx+u*u*x,qy=(1-u)*(1-u)*o[1]+2*(1-u)*u*my+u*u*y;
    ctx.fillStyle=ACC;ctx.beginPath();ctx.arc(qx,qy,2.2,0,7);ctx.fill()});
  ctx.font='500 11px "Geist Mono", monospace';
  CITIES.forEach((c,i)=>{const [x,y]=c.xy,on=c.p<=phase;
    if(on){const pr=((t*.001+i*.3)%1.6)/1.6;ctx.strokeStyle=hexA(ACC,.7*(1-pr));ctx.beginPath();ctx.arc(x,y,4+pr*16,0,7);ctx.stroke();ctx.fillStyle=ACC;ctx.beginPath();ctx.arc(x,y,c.m?4:3,0,7);ctx.fill()}
    else{ctx.strokeStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.stroke()}
    if(c.m||on&&W>700){ctx.fillStyle=on?(c.m?'#EEF1F5':'#9BA3AF'):'rgba(255,255,255,.4)';const left=['Guadalajara','Rotterdam','Monterrey'].includes(c.n);const lx=left?x-ctx.measureText(c.n.toUpperCase()).width-8:x+8;const ly=c.n==='Guadalajara'?y+12:c.n==='Rotterdam'?y-6:c.n==='Milan'?y+12:y+4;ctx.fillText(c.n.toUpperCase(),lx,ly)}
  });
}
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()).then(topo=>{
  const fc=topojson.feature(topo,topo.objects.countries);fc.features=fc.features.filter(f=>f.id!=='010');land=fc;build();
}).catch(()=>{});
new ResizeObserver(build).observe(cv);
requestAnimationFrame(draw);
</script>
</body>
</html>
